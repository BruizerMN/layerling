# Layerling dev: TLS (VM-local mkcert CA, already trusted on the Macs) in front of the app on 127.0.0.1:3100.
# Same pattern as hundchen-wx-dev.conf / airwaysim-dev.conf: its own server_name on :443.
server {
    listen 443 ssl;
    server_name layerling.local;
    ssl_certificate     /home/bill/.local/share/layerling/certs/layerling.local.pem;
    ssl_certificate_key /home/bill/.local/share/layerling/certs/layerling.local-key.pem;
    client_max_body_size 600m;   # only for server-side shared projects (off); matches the 512 MB archive cap
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
